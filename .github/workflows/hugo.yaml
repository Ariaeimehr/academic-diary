# ==============================================================================
# GITHUB ACTIONS WORKFLOW: Build & Deploy Hugo Blox to GitHub Pages
# File: .github/workflows/hugo.yaml
# ==============================================================================
name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# Force GitHub Actions to use Node 24 for all steps
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.144.0" # ارتقا به آخرین نسخه (خطای صفحه‌بندی قبلاً رفع شد)
      GO_VERSION: "1.24.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false # غیرفعال کردن کش برای جلوگیری از تداخل

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Pages configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Initialize & Fetch Hugo Modules (Fix for get_hook)
        run: |
          rm -f go.mod go.sum
          hugo mod init github.com/Ariaeimehr/academic-diary
          hugo mod clean --all
          hugo mod get -u ./...
          hugo mod tidy

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
